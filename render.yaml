services:
  - type: web
    name: og-ex-demo-0-1-0
    runtime: elixir
    plan: free
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/v0_1_0/bin/server
    healthCheckPath: /
    envVars:
      # Pin compatible versions so build and runtime images cannot drift apart.
      - key: ELIXIR_VERSION
        value: 1.19.5
      - key: ERLANG_VERSION
        value: "28.3"
      - key: SECRET_KEY_BASE
        generateValue: true
